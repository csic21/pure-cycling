name: Legacy tag publication retired

# Deliberately no tag trigger and no publishing credentials. All releases are
# requested on main through publish-request.yml and its guarded controller.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Release publication now requires .github/release-request.json on main.'
          echo 'Use Publish requested release, which verifies source, APK version and signer continuity.'
